name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update leaderboard data
        run: |
          if curl -fsS --max-time 30 'http://api.mylittlecraft.top:19396/api/v1/leaderboard/playtime?limit=100' -o /tmp/leaderboard.json; then
            mv /tmp/leaderboard.json public/data/leaderboard.json
          else
            echo "排行榜接口抓取失败，沿用仓库中的数据"
          fi
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /mlcweb/
          VITE_LEADERBOARD_ENDPOINT: data/leaderboard.json
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
