name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update leaderboard data
        run: |
          update_leaderboard() {
            if curl -fsS --max-time 30 "http://api.mylittlecraft.top:19396/api/v1/leaderboard/$1?limit=100" -o "/tmp/$2"; then
              mv "/tmp/$2" "public/data/$2"
            else
              echo "$1 排行榜接口抓取失败，沿用仓库中的数据"
            fi
          }
          update_leaderboard playtime leaderboard.json
          update_leaderboard economy economy-leaderboard.json
          if curl -fsS --max-time 60 "http://api.mylittlecraft.top:19396/api/v1/totalassault/leaderboard" -o /tmp/totalassault-leaderboard.json; then
            mv /tmp/totalassault-leaderboard.json public/data/totalassault-leaderboard.json
          else
            echo "总力战排行榜接口抓取失败，沿用仓库中的数据"
          fi
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /mlcweb/
          VITE_LEADERBOARD_ENDPOINT: data/leaderboard.json
          VITE_ECONOMY_LEADERBOARD_ENDPOINT: data/economy-leaderboard.json
          VITE_TOTAL_ASSAULT_ENDPOINT: data/totalassault-leaderboard.json
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
